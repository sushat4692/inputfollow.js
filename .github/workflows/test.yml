name: Test

on:
    push:
        branches:
            - develop
            - master
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci
            - name: Install Playwright chromium
              run: npx playwright install --with-deps chromium

            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Build
              run: npm run build
            - name: Test
              run: npm test
